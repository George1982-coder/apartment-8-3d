<!DOCTYPE html>
<html lang="ka" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="דירה 8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>ბინა №8 — 2D / 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1720; --ink-2:#16212c; --line:#2a3a49;
    --paper:#e8e3d7; --dim:#9aa8b4; --blue:#5fb3d4; --amber:#e0a458;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--ink);color:var(--paper)}
  body{
    font-family:"Noto Sans Georgian","Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) 20px max(96px, calc(28px + env(safe-area-inset-bottom)));
  }
  .wrap{width:min(720px,100%)}
  .kicker{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px;letter-spacing:.18em;color:var(--dim);margin-bottom:10px;
  }
  h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:.02em}
  .meta{
    margin-top:8px;color:var(--dim);font-size:15px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;
  }
  .meta b{color:var(--blue);font-weight:500}
  .sub{margin-top:14px;color:var(--dim);font-size:15px;line-height:1.6}
  .grid{
    margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:14px;
  }
  a.card{
    display:flex;flex-direction:column;gap:10px;
    min-height:210px;padding:22px 20px 20px;
    text-decoration:none;color:inherit;
    background:rgba(22,33,44,.88);border:1px solid var(--line);border-radius:18px;
    transition:transform .16s,border-color .16s,background .16s;
  }
  a.card:hover{border-color:var(--blue);transform:translateY(-2px)}
  a.card:active{transform:scale(.98)}
  .mark{
    width:54px;height:54px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(95,179,212,.12);color:var(--blue);font-weight:800;font-size:18px;
  }
  a.card.three .mark{background:rgba(224,164,88,.14);color:var(--amber)}
  .ttl{font-size:22px;font-weight:800;margin-top:auto}
  .cap{font-size:13.5px;color:var(--dim);line-height:1.55}
  .install-note{
    margin-top:22px;color:var(--dim);font-size:13.5px;line-height:1.65;text-align:right;direction:rtl;
  }
  @media (max-width:560px){
    .grid{grid-template-columns:1fr}
    a.card{min-height:160px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">RUSTAVI · APARTMENT 8</p>
    <h1>ბინა №8</h1>
    <p class="meta">85.7 m² <b>+</b> 14.6 m² <b>=</b> 100.3 m²</p>
    <p class="sub">בחרו תצוגה — תוכנית 2D או מודל 3D</p>
    <div class="grid">
      <a class="card" href="/2d">
        <div class="mark">2D</div>
        <div class="ttl">2D</div>
        <p class="cap">תוכנית קומה עם מידות, חדרים וריהוט</p>
      </a>
      <a class="card three" href="/3d">
        <div class="mark">3D</div>
        <div class="ttl">3D</div>
        <p class="cap">מודל תלת־ממד — סיבוב, חתך וגובה קירות</p>
      </a>
    </div>
    <p class="install-note">אפשר גם להתקין למסך הבית במובייל — באנדרואיד יופיע כפתור התקנה, ובאייפון: Safari → שיתוף → הוספה למסך הבית.</p>
  </div>
  <script src="/pwa.js"></script>
</body>
</html>
