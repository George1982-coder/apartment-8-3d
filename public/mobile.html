<!DOCTYPE html>
<html lang="ka" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1720">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ბინა №8 — 3D მოდელი</title>
<style>
  :root{
    --ink:#0f1720;
    --ink-2:#16212c;
    --line:#2a3a49;
    --paper:#e8e3d7;
    --dim:#9aa8b4;
    --blue:#5fb3d4;
    --amber:#e0a458;
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;background:var(--ink);
    overscroll-behavior:none;touch-action:none;
  }
  body{
    font-family:"Noto Sans Georgian","BPG Arial","Sylfaen","Segoe UI",Arial,sans-serif;
    color:var(--paper);-webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------- top bar ---------- */
  #top{
    position:fixed;z-index:10;top:0;right:0;left:0;
    padding:calc(var(--safe-t) + 10px) 14px 22px;
    background:linear-gradient(180deg,rgba(15,23,32,.94) 30%,rgba(15,23,32,0));
    pointer-events:none;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  #top .t1{font-size:15px;font-weight:700;letter-spacing:.01em}
  #top .t2{
    font-size:11.5px;color:var(--dim);margin-top:2px;
    font-variant-numeric:tabular-nums;direction:ltr;text-align:left;
  }
  #top .t2 b{color:var(--blue);font-weight:600}
  .top-actions{pointer-events:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  #mode{
    display:flex;gap:3px;padding:3px;border-radius:12px;
    background:rgba(30,44,58,.9);border:1px solid var(--line);
  }
  #mode a{
    min-width:44px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:9px;text-decoration:none;font-size:13px;font-weight:700;
    color:var(--dim);
  }
  #mode a.on{background:var(--blue);color:#0d1720}
  #menuBtn{
    pointer-events:auto;flex:0 0 auto;
    width:46px;height:46px;border-radius:12px;
    background:rgba(30,44,58,.9);border:1px solid var(--line);
    color:var(--paper);font-size:19px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  #menuBtn:active{background:var(--blue);color:#0d1720}

  /* ---------- bottom controls ---------- */
  #dock{
    position:fixed;z-index:11;right:12px;left:12px;
    bottom:calc(var(--safe-b) + 12px);
    background:rgba(22,33,44,.9);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;
    padding:10px;display:flex;flex-direction:column;gap:8px;
  }
  .row{display:flex;align-items:center;gap:9px}
  .row > .cap{
    flex:0 0 74px;font-size:11px;color:var(--dim);letter-spacing:.02em;
  }
  .seg{flex:1;display:flex;gap:6px}
  .seg button{
    flex:1;min-height:44px;
    appearance:none;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:500;color:var(--dim);
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:11px;padding:6px 2px;
    transition:background .14s,color .14s,border-color .14s;
  }
  .seg button.on{background:var(--blue);border-color:var(--blue);color:#0d1720;font-weight:700}
  .seg button:active{transform:scale(.97)}

  /* ---------- sheet ---------- */
  #scrim{
    position:fixed;inset:0;z-index:19;background:rgba(8,13,18,.6);
    opacity:0;pointer-events:none;transition:opacity .22s;
  }
  #scrim.open{opacity:1;pointer-events:auto}
  #sheet{
    position:fixed;z-index:20;right:0;left:0;bottom:0;
    max-height:82%;overflow:auto;-webkit-overflow-scrolling:touch;
    background:var(--ink-2);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:8px 18px calc(var(--safe-b) + 24px);
    transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.4,1);
    touch-action:pan-y;
  }
  #sheet.open{transform:translateY(0)}
  #sheet .grab{
    width:42px;height:4px;border-radius:4px;background:var(--line);
    margin:8px auto 16px;
  }
  .sec{
    font-size:11px;letter-spacing:.14em;color:var(--dim);
    margin:0 0 9px;
  }
  .sec + .sec{margin-top:22px}
  .tgl{
    width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
    color:var(--dim);font-family:inherit;font-size:14.5px;padding:0 14px;
    margin-bottom:8px;cursor:pointer;
  }
  .tgl .sw{
    width:40px;height:23px;border-radius:23px;background:#33424f;position:relative;
    transition:background .16s;flex:0 0 40px;
  }
  .tgl .sw::after{
    content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;
    border-radius:50%;background:#8d9aa6;transition:transform .16s,background .16s;
  }
  .tgl.on{color:var(--paper)}
  .tgl.on .sw{background:rgba(224,164,88,.35)}
  .tgl.on .sw::after{background:var(--amber);transform:translateX(17px)}

  ul.rooms{list-style:none}
  ul.rooms li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid rgba(154,168,180,.12);font-size:14.5px;
  }
  ul.rooms li .nm{display:flex;align-items:center;gap:9px}
  ul.rooms li .sw2{width:11px;height:11px;border-radius:2px;flex:0 0 11px}
  ul.rooms li .a{color:var(--blue);font-size:13.5px;direction:ltr;font-variant-numeric:tabular-nums}
  ul.rooms li.sum{border-bottom:0;border-top:1px solid var(--line);margin-top:6px;font-weight:700}
  ul.rooms li.sum .a{color:var(--amber)}
  .note{font-size:12.5px;color:var(--dim);line-height:1.75;margin-top:14px}

  #loading{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:var(--dim);font-size:13px;letter-spacing:.18em;
    transition:opacity .5s;
  }
  #loading.gone{opacity:0;pointer-events:none}

  /* desktop niceties */
  @media (min-width:900px){
    #dock{right:auto;left:50%;transform:translateX(-50%);width:640px;flex-direction:row;gap:14px}
    .row{flex:1}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="top">
  <div>
    <div class="t1">ბინა №8</div>
    <div class="t2">85.7 <b>+</b> 14.6 <b>=</b> 100.3 m²</div>
  </div>
  <div class="top-actions">
    <nav id="mode" aria-label="2D or 3D">
      <a href="/2d">2D</a>
      <a href="/3d" class="on">3D</a>
    </nav>
    <button id="menuBtn" aria-label="პანელის გახსნა">☰</button>
  </div>
</div>

<div id="dock">
  <div class="row">
    <span class="cap">კედლები</span>
    <div class="seg" id="segCut">
      <button data-cut="2.75" class="on">სრული</button>
      <button data-cut="1.15">ჭრილი</button>
      <button data-cut="0.06">იატაკი</button>
    </div>
  </div>
  <div class="row">
    <span class="cap">ხედი</span>
    <div class="seg" id="segView">
      <button data-view="iso" class="on">3D</button>
      <button data-view="top">ზემოდან</button>
      <button data-view="eye">თვალის დონე</button>
    </div>
  </div>
</div>

<div id="scrim"></div>
<div id="sheet">
  <div class="grab"></div>

  <p class="sec">ფენები</p>
  <button class="tgl on" id="tFurn">ავეჯი<span class="sw"></span></button>
  <button class="tgl on" id="tLbl">ოთახების სახელები<span class="sw"></span></button>
  <button class="tgl on" id="tGlass">ფანჯრები და მინა<span class="sw"></span></button>
  <button class="tgl" id="tSpin">ავტომატური ბრუნვა<span class="sw"></span></button>

  <p class="sec">ოთახები</p>
  <ul class="rooms" id="roomList"></ul>

  <p class="note">
    მართვა: ერთი თითი — ბრუნვა · პინჩი — მასშტაბი · ორი თითი — გადაადგილება.<br>
    ეკრანზე ორმაგი შეხება აბრუნებს საწყის ხედს.
  </p>
</div>

<div id="loading">იტვირთება…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

if(!window.THREE){
  document.getElementById('loading').textContent = 'პირველი გახსნისას საჭიროა ინტერნეტი';
  return;
}

/* ============================================================
   ბინა №8 — მოდელი არქიტექტორის გეგმის მიხედვით. ერთეულები: მეტრი.
   ============================================================ */
var H = 2.75, EXT = 0.30, INT = 0.15, PAR = 1.05;
var isMobile = Math.min(window.innerWidth, window.innerHeight) < 820;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1720);
scene.fog = new THREE.Fog(0x0f1720, 26, 64);

var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);

var renderer = new THREE.WebGLRenderer({antialias:!isMobile, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 2 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = isMobile ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('stage').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdce7f0, 0x2b3742, 0.9));

var sun = new THREE.DirectionalLight(0xfff2dd, 0.95);
sun.position.set(-9, 16, -7);
sun.castShadow = true;
var sm = isMobile ? 1024 : 2048;
sun.shadow.mapSize.width = sm; sun.shadow.mapSize.height = sm;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
sun.shadow.bias = -0.0007;
scene.add(sun);

var fill = new THREE.DirectionalLight(0x9fc4dd, 0.28);
fill.position.set(11, 8, 12);
scene.add(fill);

var clipPlane = new THREE.Plane(new THREE.Vector3(0,-1,0), H);

var wallMat = new THREE.MeshStandardMaterial({color:0xe6e1d6, roughness:0.94, clippingPlanes:[clipPlane], clipShadows:true});
var wallExtMat = new THREE.MeshStandardMaterial({color:0xd6d0c3, roughness:0.96, clippingPlanes:[clipPlane], clipShadows:true});
var glassMat = new THREE.MeshStandardMaterial({color:0x9fd4e8, roughness:0.08, transparent:true, opacity:0.24, side:THREE.DoubleSide, clippingPlanes:[clipPlane]});
var frameMat = new THREE.MeshStandardMaterial({color:0x4a5560, roughness:0.6, metalness:0.2, clippingPlanes:[clipPlane]});
var slabMat = new THREE.MeshStandardMaterial({color:0x1b2732, roughness:1});

var wallGroup = new THREE.Group(); scene.add(wallGroup);
var glassGroup = new THREE.Group(); scene.add(glassGroup);
var floorGroup = new THREE.Group(); scene.add(floorGroup);
var furnGroup = new THREE.Group(); scene.add(furnGroup);
var labelGroup = new THREE.Group(); scene.add(labelGroup);

/* ---------- კედელი ღიობებით ---------- */
function addWall(x1,z1,x2,z2,t,h,openings,mat){
  mat = mat || wallMat; h = h || H;
  openings = (openings||[]).slice().sort(function(a,b){return a.a-b.a;});
  var dx=x2-x1, dz=z2-z1, len=Math.sqrt(dx*dx+dz*dz), ang=Math.atan2(dz,dx);
  var g = new THREE.Group(), gg = new THREE.Group();

  function piece(a,b,y0,y1,m,th,target){
    if(b-a < 0.004 || y1-y0 < 0.004) return;
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(b-a, y1-y0, th||t), m||mat);
    mesh.position.set((a+b)/2, (y0+y1)/2, 0);
    mesh.castShadow = true; mesh.receiveShadow = true;
    (target||g).add(mesh);
  }

  var cur = 0;
  for(var i=0;i<openings.length;i++){
    var o = openings[i];
    piece(cur, o.a, 0, h);
    piece(o.a, o.b, 0, o.sill);
    piece(o.a, o.b, o.top, h);
    if(o.glass){
      piece(o.a+0.05, o.b-0.05, o.sill+0.05, o.top-0.05, glassMat, t*0.18, gg);
      piece(o.a, o.a+0.05, o.sill, o.top, frameMat, t*0.34, gg);
      piece(o.b-0.05, o.b, o.sill, o.top, frameMat, t*0.34, gg);
      piece(o.a, o.b, o.top-0.05, o.top, frameMat, t*0.34, gg);
      if(o.sill > 0.02) piece(o.a, o.b, o.sill, o.sill+0.05, frameMat, t*0.34, gg);
    }
    cur = o.b;
  }
  piece(cur, len, 0, h);

  g.position.set(x1,0,z1);  g.rotation.y = -ang;
  gg.position.set(x1,0,z1); gg.rotation.y = -ang;
  wallGroup.add(g); glassGroup.add(gg);
}

/* ---------- კედლები ---------- */
addWall(-0.30,-0.15, 9.50,-0.15, EXT, H, [
  {a:0.45,b:3.25,sill:0,top:2.35,glass:true},
  {a:3.80,b:6.15,sill:0,top:2.35,glass:true},
  {a:6.60,b:9.35,sill:0,top:2.35,glass:true}
], wallExtMat);

addWall(-0.15,-1.75, -0.15,6.39, EXT, H, [
  {a:2.85,b:4.35,sill:0.85,top:2.35,glass:true},
  {a:6.70,b:7.60,sill:0,top:2.20,glass:true}
], wallExtMat);

addWall(9.50,-1.75, 9.50,7.20, EXT, H, [
  {a:3.35,b:5.35,sill:0.85,top:2.35,glass:true},
  {a:7.65,b:8.25,sill:1.40,top:2.20,glass:true}
], wallExtMat);

addWall(-2.00,6.24, -2.00,9.75, EXT, H, [
  {a:1.06,b:2.46,sill:0.85,top:2.35,glass:true}
], wallExtMat);

addWall(-2.15,9.60, 6.15,9.60, EXT, H, [
  {a:2.35,b:3.95,sill:0.85,top:2.35,glass:true},
  {a:6.75,b:7.55,sill:1.50,top:2.30,glass:true}
], wallExtMat);

addWall(6.15,6.60, 6.15,9.75, EXT, H, [], wallExtMat);
addWall(6.00,6.75, 7.25,6.75, EXT, H, [{a:0.20,b:1.05,sill:0,top:2.20}], wallExtMat);
addWall(7.10,7.05, 9.65,7.05, EXT, H, [], wallExtMat);

addWall(7.175,5.41, 7.175,7.05, INT, H, [{a:0.29,b:1.09,sill:0,top:2.10}]);
addWall(6.075,5.485, 9.50,5.485, INT, H, [{a:0.225,b:1.025,sill:0,top:2.10}]);
addWall(6.075,-0.15, 6.075,6.75, INT, H, [{a:5.85,b:6.65,sill:0,top:2.10}]);
addWall(3.275,4.755, 6.075,4.755, INT, H, [{a:1.775,b:2.625,sill:0,top:2.10}]);
addWall(3.275,-0.15, 3.275,7.70, INT, H, [
  {a:5.25,b:6.30,sill:0,top:2.30},
  {a:6.70,b:7.60,sill:0,top:2.10}
]);
addWall(3.275,7.625, 6.075,7.625, INT, H, [{a:0.325,b:1.225,sill:0,top:2.10}]);
addWall(-2.15,6.315, 3.275,6.315, 0.20, H, [], wallExtMat);

addWall(-0.30,-1.675, 9.50,-1.675, 0.15, PAR, [], wallExtMat);
addWall(-1.925,4.665, -0.15,4.665, 0.15, PAR, [], wallExtMat);
addWall(-1.925,4.665, -1.925,6.315, 0.15, PAR, [], wallExtMat);

/* ---------- იატაკები ---------- */
var C = {live:0xc9a882, bed:0xd2b691, hall:0xc4b8a4, wet:0x93a6ad, out:0x8e8b82};

var rooms = [
  {n:'მისაღები + სამზარეულო',     a:'20.5', x1:0,     z1:0,     x2:3.20, z2:6.24, c:C.live},
  {n:'საძინებელი',        a:'12.4', x1:3.35,  z1:0,     x2:6.00, z2:4.68, c:C.bed},
  {n:'მთავარი საძინებელი',       a:'17.1', x1:6.15,  z1:0,     x2:9.35, z2:5.41, c:C.bed},
  {n:'საძინებელი',        a:'14.7', x1:-1.85, z1:6.39,  x2:3.20, z2:9.30, c:C.bed},
  {n:'დერეფანი',          a:'8.4',  x1:3.35,  z1:4.83,  x2:6.00, z2:7.55, c:C.hall},
  {n:'',                a:'',     x1:6.15,  z1:5.56,  x2:7.10, z2:6.60, c:C.hall},
  {n:'სააბაზანო',        a:'4.2',  x1:3.35,  z1:7.70,  x2:6.00, z2:9.45, c:C.wet},
  {n:'საპირფარეშო + სამრეცხაო', a:'2.8',  x1:7.25,  z1:5.56,  x2:9.35, z2:6.90, c:C.wet},
  {n:'აივანი',           a:'12.3', x1:0,     z1:-1.60, x2:9.35, z2:-0.30, c:C.out, out:true},
  {n:'აივანი',           a:'2.3',  x1:-1.85, z1:4.74,  x2:-0.30, z2:6.24, c:C.out, out:true}
];

rooms.forEach(function(r){
  var w = r.x2-r.x1, d = r.z2-r.z1;
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.14, d),
    new THREE.MeshStandardMaterial({color:r.c, roughness:0.92}));
  m.position.set(r.x1+w/2, (r.out?-0.03:0)-0.07, r.z1+d/2);
  m.receiveShadow = true;
  floorGroup.add(m);
});

var base = new THREE.Mesh(new THREE.BoxGeometry(13.4, 0.30, 12.6), slabMat);
base.position.set(3.6, -0.29, 4.0);
base.receiveShadow = true;
scene.add(base);

/* ---------- ავეჯი ---------- */
var M = {
  wood : new THREE.MeshStandardMaterial({color:0x8a5f3c, roughness:0.75}),
  wood2: new THREE.MeshStandardMaterial({color:0xb08757, roughness:0.7}),
  soft : new THREE.MeshStandardMaterial({color:0x5d6b78, roughness:0.95}),
  soft2: new THREE.MeshStandardMaterial({color:0x7c8b98, roughness:0.95}),
  linen: new THREE.MeshStandardMaterial({color:0xe9e4da, roughness:0.95}),
  white: new THREE.MeshStandardMaterial({color:0xf2f2f0, roughness:0.4}),
  dark : new THREE.MeshStandardMaterial({color:0x2b333b, roughness:0.6}),
  steel: new THREE.MeshStandardMaterial({color:0xb9c2c8, roughness:0.3, metalness:0.6}),
  stone: new THREE.MeshStandardMaterial({color:0x39424b, roughness:0.5}),
  green: new THREE.MeshStandardMaterial({color:0x4d6b4a, roughness:0.9})
};

function mk(w,h,d,x,y,z,mat,parent,ry){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, y+h/2, z);
  if(ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  (parent||furnGroup).add(m);
  return m;
}

function bed(cx,cz,w,l,dir){
  var g = new THREE.Group();
  mk(w,0.28,l,0,0,0,M.wood,g);
  mk(w-0.10,0.20,l-0.10,0,0.28,0,M.linen,g);
  mk(w*0.42,0.12,0.42,-w*0.24,0.48,-l/2+0.34,M.white,g);
  mk(w*0.42,0.12,0.42, w*0.24,0.48,-l/2+0.34,M.white,g);
  mk(w-0.10,0.06,l*0.55,0,0.48,l*0.16,M.soft2,g);

/* ---------- წარწერები ---------- */
function makeLabel(text, sub){
  var c = document.createElement('canvas'), s = 3;
  c.width = 340*s; c.height = 128*s;
  var g = c.getContext('2d');
  g.scale(s,s); g.direction = 'ltr'; g.textAlign = 'center';
  g.fillStyle = 'rgba(14,22,30,0.82)';
  g.strokeStyle = 'rgba(95,179,212,0.9)';
  g.lineWidth = 1.6;
  var x=8,y=8,w=324,h=112,r=6;
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath(); g.fill(); g.stroke();
  var size = 42;
  g.font = 'bold ' + size + 'px "Noto Sans Georgian", Arial, sans-serif';
  while(size > 20 && g.measureText(text).width > 292){
    size -= 2;
    g.font = 'bold ' + size + 'px "Noto Sans Georgian", Arial, sans-serif';
  }
  g.fillStyle = '#eae5da';
  g.fillText(text, 170, 58);
  g.fillStyle = '#5fb3d4';
  g.font = 'bold 34px Arial, sans-serif';
  g.fillText(sub, 170, 99);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
  sp.scale.set(1.7, 0.64, 1);
  sp.renderOrder = 999;
  return sp;
}

function buildLabels(){
  while(labelGroup.children.length){ labelGroup.remove(labelGroup.children[0]); }
  rooms.forEach(function(r){
    if(!r.n) return;
    var sp = makeLabel(r.n, r.a + ' m²');
    sp.position.set((r.x1+r.x2)/2, 1.5, (r.z1+r.z2)/2);
    labelGroup.add(sp);
  });
  dirty = true;
}
buildLabels();
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(buildLabels);
}

/* ============================================================
   კამერა და შეხება
   ============================================================ */
var VIEWS = {
  iso: {th:-2.15, ph:0.92, r:19, t:[3.7,0.9,3.9]},
  top: {th:-Math.PI/2, ph:0.07, r:17, t:[3.7,0,3.9]},
  eye: {th:-1.85, ph:1.45, r:12, t:[3.7,1.5,4.2]}
};

var target = new THREE.Vector3(3.7, 0.9, 3.9);
var theta = -2.15, phi = 0.92, radius = 19;
var spin = false, dirty = true;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function updateCamera(){
  phi = clamp(phi, 0.06, Math.PI/2 - 0.03);
  radius = clamp(radius, 2.5, 60);
  target.x = clamp(target.x, -12, 20);
  target.z = clamp(target.z, -12, 20);
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.cos(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.sin(theta)
  );
  camera.lookAt(target);
  dirty = true;
}

function applyView(name){
  var v = VIEWS[name] || VIEWS.iso;
  theta = v.th; phi = v.ph; radius = v.r;
  target.set(v.t[0], v.t[1], v.t[2]);
  updateCamera();
}

function panBy(dx,dy){
  var k = radius * 0.0018;
  var right = new THREE.Vector3(Math.sin(theta), 0, -Math.cos(theta));
  var fwd   = new THREE.Vector3(-Math.cos(theta), 0, -Math.sin(theta));
  target.addScaledVector(right, -dx*k);
  target.addScaledVector(fwd,  -dy*k);
}

var el = renderer.domElement;
var oneT = null, twoT = null, lastTap = 0;

function td(e){
  var dx = e.touches[0].clientX - e.touches[1].clientX;
  var dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
function tmx(e){ return (e.touches[0].clientX + e.touches[1].clientX)/2; }
function tmy(e){ return (e.touches[0].clientY + e.touches[1].clientY)/2; }

el.addEventListener('touchstart', function(e){
  spin = false; syncSpin();
  if(e.touches.length === 1){
    oneT = {x:e.touches[0].clientX, y:e.touches[0].clientY, moved:0};
    twoT = null;
    var now = Date.now();
    if(now - lastTap < 300){ applyView(currentView); }
    lastTap = now;
  } else if(e.touches.length === 2){
    oneT = null;
    twoT = {d:td(e), x:tmx(e), y:tmy(e)};
  }
}, {passive:true});

el.addEventListener('touchmove', function(e){
  e.preventDefault();
  if(e.touches.length === 2 && twoT){
    var d = td(e);
    if(d > 0) radius *= twoT.d / d;
    panBy(tmx(e)-twoT.x, tmy(e)-twoT.y);
    twoT = {d:d, x:tmx(e), y:tmy(e)};
    updateCamera();
    return;
  }
  if(e.touches.length === 1 && oneT){
    var cx = e.touches[0].clientX, cy = e.touches[0].clientY;
    var dx = cx - oneT.x, dy = cy - oneT.y;
    oneT.x = cx; oneT.y = cy; oneT.moved += Math.abs(dx)+Math.abs(dy);
    theta -= dx * 0.0068;
    phi   -= dy * 0.0068;
    updateCamera();
  }
}, {passive:false});

el.addEventListener('touchend', function(e){
  if(e.touches.length === 0){ oneT = null; twoT = null; }
  else if(e.touches.length === 1){
    twoT = null;
    oneT = {x:e.touches[0].clientX, y:e.touches[0].clientY, moved:99};
  }
}, {passive:true});

/* მაუსი (დესკტოპისთვის) */
var mDrag = null;
el.addEventListener('mousedown', function(e){
  spin = false; syncSpin();
  mDrag = {x:e.clientX, y:e.clientY, pan:(e.shiftKey || e.button !== 0)};
});
window.addEventListener('mousemove', function(e){
  if(!mDrag) return;
  var dx = e.clientX - mDrag.x, dy = e.clientY - mDrag.y;
  mDrag.x = e.clientX; mDrag.y = e.clientY;
  if(mDrag.pan) panBy(dx,dy);
  else { theta -= dx*0.006; phi -= dy*0.006; }
  updateCamera();
});
window.addEventListener('mouseup', function(){ mDrag = null; });
el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
el.addEventListener('wheel', function(e){
  e.preventDefault();
  radius *= (1 + Math.sign(e.deltaY) * 0.09);
  updateCamera();
}, {passive:false});

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

/* ============================================================
   ინტერფეისი
   ============================================================ */
var currentView = 'iso';

function seg(id, fn){
  var box = document.getElementById(id);
  box.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    var all = box.querySelectorAll('button');
    for(var i=0;i<all.length;i++) all[i].classList.remove('on');
    b.classList.add('on');
    fn(b);
  });
}

seg('segCut', function(b){ clipPlane.constant = parseFloat(b.getAttribute('data-cut')); dirty = true; });
seg('segView', function(b){ currentView = b.getAttribute('data-view'); applyView(currentView); });

function tgl(id, fn){
  var b = document.getElementById(id);
  b.addEventListener('click', function(){
    b.classList.toggle('on');
    fn(b.classList.contains('on'));
    dirty = true;
  });
}
tgl('tFurn',  function(on){ furnGroup.visible = on; });
tgl('tLbl',   function(on){ labelGroup.visible = on; });
tgl('tGlass', function(on){ glassGroup.visible = on; });
tgl('tSpin',  function(on){ spin = on; if(on) closeSheet(); });

function syncSpin(){
  if(!spin) document.getElementById('tSpin').classList.remove('on');
}

var sheet = document.getElementById('sheet');
var scrim = document.getElementById('scrim');
function openSheet(){ sheet.classList.add('open'); scrim.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click', openSheet);
scrim.addEventListener('click', closeSheet);
sheet.querySelector('.grab').addEventListener('click', closeSheet);

/* ---------- resize (მობილურის ბრაუზერის პანელის სიმაღლის ცვლილებაც) ---------- */
function resize(){
  var w = window.innerWidth;
  var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  camera.aspect = w/h;
  camera.fov = w < 520 ? 52 : 45;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, true);
  dirty = true;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
applyView('iso');

/* ---------- render loop ---------- */
function tick(){
  requestAnimationFrame(tick);
  if(spin){ theta += 0.0022; updateCamera(); }
  if(dirty){ renderer.render(scene, camera); dirty = false; }
}
tick();

setTimeout(function(){ document.getElementById('loading').classList.add('gone'); }, 400);

})();
